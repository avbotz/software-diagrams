name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the d2 in mise.lock (the action adds --locked when there is a lockfile).
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.8.16

      - name: Formatting, and every render up to date
        run: mise run check
